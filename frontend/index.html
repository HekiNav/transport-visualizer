<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hekinav Transport Visualizer</title>
</head>

<body class="bg-neutral-900">
  <div id="loading"
    style="border: 0; position: absolute; width: 100vw; height: 100vh; z-index: 10000000; top: 0; left: 0; background-color: #222; display: flex; align-items: center; justify-content: center; color: #eee; font-size: 3em; font-family: Jost, Arial, Helvetica, sans-serif; flex-direction: column; opacity: 1; transition: 0.5s;">
    LOADING
    <noscript>This site needs JavaScript to function</noscript>
  </div>
  <div id="app" class="h-screen flex">
    <div id="content" class="h-full bg-neutral-900 p-8 overflow-y-scroll">
      <h1 class="text-4xl text-cyan-500 mb-4">Hekinav Transport Visualizer</h1>
      <h2 class="text-2xl text-cyan-500 mb-4">1. Select data</h2>
      <div class="w-full flex justify-between gap-4 items-center">
        <label for="dataSource" class="text-nowrap grow-1 text-lg text-neutral-200">Data source</label>
        <select id="dataSource" class="shrink-1" multiple>
          <option value="DIGITRAFFIC" selected>Digitraffic</option>
          <option value="HSL">HSL</option>
        </select>
      </div>
      <div class="w-full flex justify-between gap-4 items-center">
        <label for="daterange" class="text-nowrap grow-1 text-lg text-neutral-200">Date range</label>
        <input type="datetime" name="" id="daterange"
          class="my-2 border-neutral-200 border-2 p-1 rounded text-neutral-200 accent-cyan-500">
      </div>
      <div class="w-full flex justify-between gap-4 items-center">
        <label for="routeType" class="text-nowrap grow-1 text-lg text-neutral-200">Route types</label>
        <select id="routeType" multiple>
          <optgroup label="Trains">
            <option value="TRAIN_LONG_DISTANCE">Long-distance trains</option>
            <option value="TRAIN_COMMUTER">Commuter trains</option>
            <option value="TRAIN_FREIGHT">Freight trains</option>
            <option value="TRAIN_SHUNT">Shunting trains</option>
            <option value="TRAIN_REGIONAL">Regional trains</option>
            <option value="TRAIN_TRANSFER">Stock transfer trains</option>
            <option value="TRAIN_SLEEPER">Sleeper trains</option>
            <option value="TRAIN_OTHER">Other trains</option>
          </optgroup>
          <optgroup label="Others">
            <option value="BUS">Bus</option>
            <option value="TRAM">Tram</option>
            <option value="FERRY">Ferry</option>
            <option value="LIGHT_RAIL">Light rail</option>
            <option value="METRO">Metro</option>
          </optgroup>
        </select>
      </div>
      <div class="w-full flex justify-between gap-4 items-center my-2">
        <label for="terminus" class="text-nowrap grow-1 text-lg text-neutral-200">Terminus</label>
        <select id="terminus" multiple>
        </select>
      </div>
      <button id="load"
        class="my-2 border-neutral-200 border-2 p-1 rounded text-neutral-200 accent-cyan-500 text-xl active:border-cyan-500 disabled:border-neutral-500">Load</button>
      <h2 class="text-2xl text-cyan-500 my-4">2. Edit style</h2>
      <div class="w-full flex justify-start gap-4 items-center">
        <input type="checkbox" checked name="" id="backgroundMap" class=" accent-cyan-500">
        <label for="backgroundMap" class="text-nowrap grow-1 text-lg text-neutral-200">Background map</label>
      </div>
      <div class="w-full flex justify-start gap-4 items-center">
        <input type="checkbox" name="" id="routeTypeColors" class=" accent-cyan-500" autocomplete="off" checked>
        <label for="routeTypeColors" class="text-nowrap grow-1 text-lg text-neutral-200">Color by route type</label>
      </div>
      <br>
      <div class="w-full flex justify-start gap-4 items-center">
        <range-slider id="tailLength" type="range" min="0" max="100" step="5" class="max-w-60 accent-cyan-500"
          value="10"></range-slider>
        <span class="text-neutral-200" id="tailLengthLabel">1</span>
        <label for="tailLength" class="text-nowrap grow-1 text-lg text-neutral-200">Tail length</label>
      </div>
      <h3 class="text-lg text-cyan-500 mt-2">Colors</h3>
      <div id="colors">

      </div>
      <div class="w-full flex justify-start gap-4 items-center">
        <range-slider type="range" min="1" max="100" id="opacity" class="max-w-60 accent-cyan-500" value="50"
          autocomplete="off"></range-slider>
        <span class="text-neutral-200" id="opacityLabel">50%</span>
        <label for="opacity" class="text-nowrap grow-1 text-lg text-neutral-200">Route opacity</label>
      </div>
      <button id="resetColors"
        class="my-2 border-neutral-200 border-2 p-1 rounded text-neutral-200 accent-cyan-500 text-xl active:border-cyan-500 disabled:border-neutral-500">Reset
        colors</button>
      <h2 class="text-2xl text-cyan-500 my-4">3. View timelapse</h2>
      <button id="toggleTimelapse"
        class="my-2 border-neutral-200 border-2 p-1 rounded text-neutral-200 accent-cyan-500 text-xl active:border-cyan-500 disabled:border-neutral-500">Switch
        to timelapse</button>
      <div id="timelapse" hidden>
        <div class="w-full flex justify-start gap-4 items-center">
          <range-slider id="timelapseSpeed" type="range" min="0.5" max="5" step="0.5" id="timelapseSpeed"
            class="max-w-60 accent-cyan-500" value="1" autocomplete="off"></range-slider>
          <span class="text-neutral-200" id="timelapseSpeedLabel">1x</span>
          <label for="timelapseSpeed" class="text-nowrap grow-1 text-lg text-neutral-200">Timelapse speed</label>
        </div>
        <p class="text-neutral-200">Frame <span id="currentFrame">0</span>/<span id="totalFrames">100</span></p>
        <div id="media-controls" class="flex items-center gap-2">
          <button id="timelapseStart"
            class="my-2 border-neutral-200 border-2 p-1 rounded accent-cyan-500 active:border-cyan-500 disabled:border-neutral-500">
            <img src="/previous.svg" alt="Start" srcset="">
          </button>
          <button id="timelapseSubtract100"
            class="my-2 border-neutral-200 border-2 p-1 rounded accent-cyan-500 active:border-cyan-500 disabled:border-neutral-500">
            <img src="/fast-backward.svg" alt="" srcset="">
          </button>
          <button id="playTimelapse"
            class="my-2 border-neutral-200 border-2 p-1 rounded accent-cyan-500 active:border-cyan-500 disabled:border-neutral-500">
            <img id="playIcon" src="/play.svg" alt="Play" srcset="">
            <img id="pauseIcon" src="/pause.svg" alt="Pause" srcset="" hidden>
            <img id="replayIcon" src="/replay.svg" alt="Replay" srcset="" hidden>
          </button>
          <button id="timelapseAdd100"
            class="my-2 border-neutral-200 border-2 p-1 rounded accent-cyan-500 active:border-cyan-500 disabled:border-neutral-500">
            <img src="/fast-forward.svg" alt="Forward" srcset="">
          </button>
          <button id="timelapseEnd"
            class="my-2 border-neutral-200 border-2 p-1 rounded accent-cyan-500 active:border-cyan-500 disabled:border-neutral-500">
            <img src="/next.svg" alt="End" srcset="">
          </button>
        </div>

      </div>
      <h2 class="text-2xl text-cyan-500 my-4">4. Export video</h2>
      <h3 class="text-2xl text-cyan-500 mt-2">Video options</h3>
      <div class="w-full flex justify-between gap-4 items-center">
        <label for="routeType" class="text-nowrap grow-1 text-lg text-neutral-200">Route types</label>
        <select id="exportResolution">
          <option value="480P_H">480P (Horizontal)</option>
          <option value="480P_V" selected>480P (Vertical)</option>
          <option value="720P_H">HD 720P (Horizontal)</option>
          <option value="720P_V">HD 720P (Vertical)</option>
          <option value="1080P_H">Full HD 1080P (Horizontal)</option>
          <option value="1080P_V">Full HD 1080P (Vertical)</option>
          <option value="1440P_H">2K 1440P (Horizontal)</option>
          <option value="1440P_V">2K 1440P (Vertical)</option>
          <option value="2160P_H">4K 2160P (Horizontal)</option>
          <option value="2160P_V">4K 2160P (Vertical)</option>
        </select>
      </div>
      <div class="w-full flex justify-between items-center flex-wrap my-2">
        <label for="exportRange" class="text-nowrap grow-1 text-lg text-neutral-200">Crop export time</label>
        <span class="text-neutral-200" id="exportRangeLabel"></span>
        <br>
        <range-slider value="0,288" min="0" max="288" step="1" name="exportRange" id="exportRange"
          aria-label="Crop the export time">
          <div data-track></div>
          <div data-track-fill></div>
          <div data-runnable-track>
            <div data-thumb aria-label="Minimum Time"></div>
            <div data-thumb aria-label="Maximum Time"></div>
          </div>
        </range-slider>
      </div>
      <h3 class="text-lg text-cyan-500 mt-2">View options</h3>
      <div class="w-full flex justify-start gap-4 items-center">
        <label for="cropExportMap" class="text-nowrap grow-1 text-lg text-neutral-200">Bound
          export map to current view</label>
        <button id="cropExportMap"
          class="my-2 border-neutral-200 border-2 p-1 rounded text-neutral-200 accent-cyan-500 text-xl active:border-cyan-500 disabled:border-neutral-500">Bound</button>
      </div>

      <div class="w-full flex justify-start gap-4 items-center">
        <input type="checkbox" name="" id="viewExportBounds" class=" accent-cyan-500">
        <label for="viewExportBounds" class="text-nowrap grow-1 text-lg text-neutral-200">View export bounds on
          map</label>
      </div>
      <button id="export"
        class="my-2 border-neutral-200 mt-8 border-2 p-1 rounded text-neutral-200 accent-cyan-500 text-xl active:border-cyan-500 disabled:border-neutral-500">Export</button>
    </div>
    <div id="map" class="h-full shrink">
      <div class="p-4 absolute top-0 left-0 z-1000 text-2xl text-neutral-200" id="time"></div>
    </div>
  </div>
  <div style="pointer-events: none; overflow: scroll; z-index: -1; position: fixed;">
    <div id="exportMapContainer" class="relative">
      <div id="exportMap" class="h-full w-full"></div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
